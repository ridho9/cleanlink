services:
  cleanlink:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - path: ${CLEANLINK_ENV_FILE:-/run/agenix/cleanlink-env}
        format: raw
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
